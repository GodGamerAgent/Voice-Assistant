name: Build Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build target'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - all
          - test

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Scripts Executable
        run: |
          chmod +x ./build.sh
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Execute Build Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
        run: |
          BUILD_TARGET="${{ github.event.inputs.build_type }}"
          if [ -z "$BUILD_TARGET" ]; then
            BUILD_TARGET="debug"
          fi
          echo "Triggering build for target: $BUILD_TARGET"
          ./build.sh "$BUILD_TARGET"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always() && (hashFiles('app/build/outputs/apk/**/*.apk') != '')
        with:
          name: voice-assist-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always() && (hashFiles('app/build/reports/tests/**') != '')
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7
